<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BDR Apps</title>
  <meta name="description" content="Internal tools for Backcountry Discovery Routes">
  <!-- Internal page: keep it out of search engines -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/bdr-favicon-32x32.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #1a1a1a;
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .logo { height: 96px; width: auto; margin-bottom: 48px; }
    .tools {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 24px;
    }
    .tool {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 190px;
      padding: 28px 16px 22px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      color: #1a1a1a;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .tool:hover, .tool:focus-visible {
      border-color: #9ca3af;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
      outline: none;
    }
    .tool svg { width: 64px; height: 64px; color: #4b5563; }
    .tool span { font-size: 14px; font-weight: 600; text-align: center; }

    /* Phones: stack the tools vertically */
    @media (max-width: 480px) {
      .logo { height: 76px; margin-bottom: 36px; }
      .tools { flex-direction: column; align-items: center; gap: 16px; }
      .tool { width: 240px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/BDR_full_logo-White_bgrd.png" alt="Backcountry Discovery Routes">

    <nav class="tools">
      <a class="tool" href="https://sweeps.ridebdr.com">
        <!-- Trophy icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/>
          <path d="M8 6H5.5a.5.5 0 0 0-.5.5V8a3 3 0 0 0 3 3"/>
          <path d="M16 6h2.5a.5.5 0 0 1 .5.5V8a3 3 0 0 1-3 3"/>
          <path d="M12 13v4"/>
          <path d="M8.5 20h7"/>
          <path d="M9.5 20l.5-3h4l.5 3"/>
        </svg>
        <span>Sweeps Dashboard</span>
      </a>

      <a class="tool" href="https://inventory.ridebdr.com">
        <!-- Stacked boxes icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="13" width="8" height="7" rx="0.5"/>
          <rect x="13" y="13" width="8" height="7" rx="0.5"/>
          <rect x="8" y="5" width="8" height="7" rx="0.5"/>
          <path d="M6 13v2.5h2V13"/>
          <path d="M16 13v2.5h2V13"/>
          <path d="M11 5v2.5h2V5"/>
        </svg>
        <span>Inventory Intelligence</span>
      </a>
    </nav>
  </main>
</body>
</html>
