<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BDR Apps</title>
  <meta name="description" content="Internal tools for Backcountry Discovery Routes">
  <!-- Internal page: keep it out of search engines -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/bdr-favicon-32x32.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f7f5; /* same page background as Sweeps and Inventory */
      color: #1a1a1a;
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .logo { width: 392px; max-width: 100%; height: auto; margin-bottom: 48px; } /* 168px tall at full size */
    .tools {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 24px;
    }
    .tool {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 260px;
      padding: 28px 16px 22px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      color: #1a1a1a;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .tool:hover, .tool:focus-visible {
      border-color: #9ca3af;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
      outline: none;
    }
    .tool svg { width: 64px; height: 64px; color: #4b5563; }
    /* Same as the tool titles beside the logo in Sweeps and Inventory (Tailwind text-xl font-bold tracking-tight) */
    .tool span { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.025em; text-align: center; }

    /* Phones: stack the tools vertically */
    @media (max-width: 480px) {
      .logo { margin-bottom: 36px; }
      .tools { flex-direction: column; align-items: center; gap: 16px; }
      .tool { width: 270px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/BDR_full_logo-White_bgrd.png" alt="Backcountry Discovery Routes">

    <nav class="tools">
      <a class="tool" href="https://sweeps.ridebdr.com">
        <!-- Line chart: lines rising, with arrowheads (built from Lucide shapes) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
          <path d="M6 12l4-4 3 2 6-6"/>
          <path d="M16 4h3v3"/>
          <path d="M6 18l4-3 3 2 6-6"/>
          <path d="M16 11h3v3"/>
        </svg>
        <span>Sweeps Dashboard</span>
      </a>

      <a class="tool" href="https://inventory.ridebdr.com">
        <!-- Clipboard with checklist and gear (built from Lucide shapes) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="8" height="4" x="6" y="2" rx="1" ry="1"/>
          <path d="M14 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <path d="m5 13.5 1.5 1.5 3-3"/>
          <path d="M11.5 14h3"/>
          <path d="m5 18 1.5 1.5 3-3"/>
          <path d="M11.5 18.5h3"/>
          <g transform="translate(10.8 -0.2) scale(0.6)" stroke-width="2.5">
            <path fill="#ffffff" d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
            <circle cx="12" cy="12" r="3"/>
          </g>
        </svg>
        <span>Inventory Intelligence</span>
      </a>
    </nav>
  </main>
</body>
</html>
